<body>

<div id="root"></div>

<script>
/* =========================================================
   CONFIGURACIÓN
   Mientras estos dos valores tengan el texto "PEGA_AQUI...",
   la aplicación funciona en MODO DEMOSTRACIÓN: usa datos de
   ejemplo guardados solo en la memoria del navegador (no toca
   Supabase). Cuando pegues tu URL y tu llave reales, la app
   pasa sola a modo real y empieza a guardar todo en tu base
   de datos de Supabase.
   ========================================================= */
const SUPABASE_URL = "https://hawxndssqzdxgdgsqukk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_OUdOKVKCDoT77shfVNKRkA_Dqdg1x3A";
// Número de WhatsApp (con indicativo de país, sin + ni espacios) al que llegan las novedades de Reportes
const WHATSAPP_NUMERO = "573103464977";

const DEMO_MODE = !(SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20);
const sb = DEMO_MODE ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null; // { id, nombre, rol, foto_url }
let currentTab = "asistencia";

const CLASES_MORADAS = ["coro","teoría y solfeo","teoria y solfeo","teoría musical","teoria musical"];
function badgeColorForClase(nombre){
  return CLASES_MORADAS.includes((nombre||"").trim().toLowerCase()) ? "morado" : "";
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function fmtFecha(d){
  return new Date(d).toLocaleDateString("es-CO", {day:"2-digit", month:"long", year:"numeric"});
}
function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,10); }

/* =========================================================
   DATOS DE EJEMPLO PARA EL MODO DEMOSTRACIÓN
   (solo existen en la memoria del navegador; se reinician
   al recargar la página)
   ========================================================= */
const DEMO = {
  perfiles: [
    {id:"p-000", pin:"000", nombre:"Silvia Ramírez", rol:"coordinadora", foto_url:null},
    {id:"p-101", pin:"101", nombre:"Camilo Torres", rol:"profesor", foto_url:null},
    {id:"p-102", pin:"102", nombre:"Laura Gómez", rol:"profesor", foto_url:null},
    {id:"p-900", pin:"900", nombre:"Andrés Peña (Logística)", rol:"logistica", foto_url:null},
  ],
  clases: [
    {id:"c-1", nombre:"Piano Infantil", profesor_id:"p-101", jornada:"AM"},
    {id:"c-2", nombre:"Coro", profesor_id:"p-101", jornada:"AM"},
    {id:"c-3", nombre:"Teoría y Solfeo", profesor_id:"p-102", jornada:"PM"},
    {id:"c-4", nombre:"Guitarra Básica", profesor_id:"p-102", jornada:"PM"},
  ],
  estudiantes: [
    {id:"e-1", nombre:"Juan Pérez", email:"juan@correo.com", telefono:"3001112233"},
    {id:"e-2", nombre:"María Rodríguez", email:"maria@correo.com", telefono:"3002223344"},
    {id:"e-3", nombre:"Andrés Ruiz", email:"andres@correo.com", telefono:"3003334455"},
    {id:"e-4", nombre:"Sofía Martínez", email:"sofia@correo.com", telefono:"3004445566"},
  ],
  estudianteClases: [
    {estudiante_id:"e-1", clase_id:"c-1"},
    {estudiante_id:"e-1", clase_id:"c-2"},
    {estudiante_id:"e-2", clase_id:"c-1"},
    {estudiante_id:"e-3", clase_id:"c-2"},
    {estudiante_id:"e-3", clase_id:"c-3"},
    {estudiante_id:"e-4", clase_id:"c-4"},
  ],
  itemsCatalogo: [
    {id:"i-1", nombre:"Atril", cantidad_disponible_por_hora:10},
    {id:"i-2", nombre:"Micrófono", cantidad_disponible_por_hora:4},
    {id:"i-3", nombre:"Parlante", cantidad_disponible_por_hora:2},
  ],
  asistencia: [],       // {estudiante_id, clase_id, profesor_id, fecha, presente}
  reportes: [],         // {profesor_id, clase_id, tipo, salon, hora, novedad, foto_url, fecha}
  solicitudes: [],      // {id, profesor_id, clase_id, salon, hora, jornada, dia, created_at}
  solicitudItems: [],   // {solicitud_id, item_id, cantidad}
  revisiones: [],       // {estudiante_id, clase_id, profesor_id, tipo, fecha, observaciones, porcentaje}
};

/* =========================================================
   CAPA DB — mismas funciones, dos "motores" por debajo:
   modo demostración (arrays en memoria) o Supabase real.
   Todas las vistas de la app llaman siempre a DB.*, nunca
   directamente a Supabase, así que el resto del código no
   cambia cuando pasas de demo a real.
   ========================================================= */
const DB = {
  async getAllPerfiles(){
    if(DEMO_MODE) return DEMO.perfiles.slice().sort((a,b)=> a.rol.localeCompare(b.rol) || a.nombre.localeCompare(b.nombre));
    const {data} = await sb.from("perfiles").select("*").order("rol").order("nombre");
    return data || [];
  },

  async updatePin(perfilId, nuevoPin){
    if(DEMO_MODE){
      if(DEMO.perfiles.some(p=>p.pin===nuevoPin && p.id!==perfilId)) return {error:{message:"Ese PIN ya lo está usando otra persona."}};
      const p = DEMO.perfiles.find(p=>p.id===perfilId);
      if(p) p.pin = nuevoPin;
      return {error:null};
    }
    const {error} = await sb.from("perfiles").update({pin:nuevoPin}).eq("id", perfilId);
    if(error && (error.message||"").toLowerCase().includes("duplicate")) return {error:{message:"Ese PIN ya lo está usando otra persona."}};
    return {error};
  },

  async loginByPin(pin){
    if(DEMO_MODE) return DEMO.perfiles.find(p=>p.pin===pin) || null;
    const {data} = await sb.from("perfiles").select("*").eq("pin", pin).maybeSingle();
    return data || null;
  },

  async getProfesores(){
    if(DEMO_MODE) return DEMO.perfiles.filter(p=>p.rol==="profesor").sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const {data} = await sb.from("perfiles").select("*").eq("rol","profesor").order("nombre");
    return data || [];
  },

  async getClasesByProfesor(profesorId){
    if(!profesorId) return [];
    if(DEMO_MODE) return DEMO.clases.filter(c=>c.profesor_id===profesorId).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const {data} = await sb.from("clases").select("*").eq("profesor_id", profesorId).order("nombre");
    return data || [];
  },

  async getEstudiantesByClase(claseId){
    if(!claseId) return [];
    if(DEMO_MODE){
      const ids = DEMO.estudianteClases.filter(ec=>ec.clase_id===claseId).map(ec=>ec.estudiante_id);
      return DEMO.estudiantes.filter(e=>ids.includes(e.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    }
    const {data} = await sb.from("estudiante_clases").select("estudiante_id, estudiantes(*)").eq("clase_id", claseId);
    return (data||[]).map(r=>r.estudiantes).filter(Boolean).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  },

  async getOtrosProfesores(estudianteId, excluirProfesorId){
    if(DEMO_MODE){
      const claseIds = DEMO.estudianteClases.filter(ec=>ec.estudiante_id===estudianteId).map(ec=>ec.clase_id);
      const clases = DEMO.clases.filter(c=>claseIds.includes(c.id) && c.profesor_id!==excluirProfesorId);
      const nombres = clases.map(c=>DEMO.perfiles.find(p=>p.id===c.profesor_id)?.nombre).filter(Boolean);
      return [...new Set(nombres)];
    }
    const {data} = await sb.from("estudiante_clases")
      .select("clases(nombre, profesor_id, perfiles:profesor_id(nombre))")
      .eq("estudiante_id", estudianteId);
    const nombres = (data||[]).map(o=>o.clases).filter(c=>c && c.profesor_id!==excluirProfesorId).map(c=>c.perfiles?.nombre).filter(Boolean);
    return [...new Set(nombres)];
  },

  async getAsistenciaPrevia(claseId, fecha){
    if(DEMO_MODE){
      const map = {};
      DEMO.asistencia.filter(a=>a.clase_id===claseId && a.fecha===fecha).forEach(a=>map[a.estudiante_id]=a.presente);
      return map;
    }
    const {data} = await sb.from("asistencia").select("estudiante_id, presente").eq("clase_id", claseId).eq("fecha", fecha);
    const map = {};
    (data||[]).forEach(p=> map[p.estudiante_id] = p.presente);
    return map;
  },

  async guardarAsistencia(rows){
    if(DEMO_MODE){
      rows.forEach(r=>{
        const idx = DEMO.asistencia.findIndex(a=>a.estudiante_id===r.estudiante_id && a.clase_id===r.clase_id && a.fecha===r.fecha);
        if(idx>=0) DEMO.asistencia[idx] = r; else DEMO.asistencia.push(r);
      });
      return {error:null};
    }
    const {error} = await sb.from("asistencia").upsert(rows, {onConflict:"estudiante_id,clase_id,fecha"});
    return {error};
  },

  async getHistorialAsistencia(estudianteId, profesorIdRestriccion){
    if(DEMO_MODE){
      let registros = DEMO.asistencia.filter(a=>a.estudiante_id===estudianteId);
      if(profesorIdRestriccion) registros = registros.filter(a=>a.profesor_id===profesorIdRestriccion);
      return registros
        .map(a=>({ fecha:a.fecha, hora:a.hora, presente:a.presente, clase: DEMO.clases.find(c=>c.id===a.clase_id)?.nombre }))
        .sort((a,b)=> b.fecha.localeCompare(a.fecha));
    }
    let query = sb.from("asistencia").select("fecha, hora, presente, clases(nombre)").eq("estudiante_id", estudianteId).order("fecha", {ascending:false});
    if(profesorIdRestriccion) query = query.eq("profesor_id", profesorIdRestriccion);
    const {data} = await query;
    return (data||[]).map(a=>({ fecha:a.fecha, hora:a.hora, presente:a.presente, clase:a.clases?.nombre }));
  },

  async getCatalogoItems(){
    if(DEMO_MODE) return DEMO.itemsCatalogo;
    const {data} = await sb.from("items_catalogo").select("*").order("nombre");
    return data || [];
  },

  async getUsosItems(dia, hora){
    if(!dia || !hora) return {};
    if(DEMO_MODE){
      const idsSolic = DEMO.solicitudes.filter(s=>s.dia===dia && s.hora===hora).map(s=>s.id);
      const usados = {};
      DEMO.solicitudItems.filter(si=>idsSolic.includes(si.solicitud_id)).forEach(si=>{
        usados[si.item_id] = (usados[si.item_id]||0) + si.cantidad;
      });
      return usados;
    }
    const {data} = await sb.from("solicitud_items")
      .select("item_id, cantidad, solicitudes!inner(dia,hora)")
      .eq("solicitudes.dia", dia).eq("solicitudes.hora", hora);
    const usados = {};
    (data||[]).forEach(u=> usados[u.item_id] = (usados[u.item_id]||0) + u.cantidad);
    return usados;
  },

  async crearSolicitud({profesor_id, clase_id, salon, hora, jornada, dia, items}){
    if(DEMO_MODE){
      const usados = await this.getUsosItems(dia, hora);
      for(const it of items){
        const cat = DEMO.itemsCatalogo.find(c=>c.id===it.item_id);
        const disponible = (cat?.cantidad_disponible_por_hora||0) - (usados[it.item_id]||0);
        if(it.cantidad > disponible) return {error:{message:`No hay suficiente disponibilidad de "${cat?.nombre}" a esa hora.`}};
      }
      const solicitudId = uid("s");
      DEMO.solicitudes.push({id:solicitudId, profesor_id, clase_id, salon, hora, jornada, dia, created_at:new Date().toISOString()});
      items.forEach(it=> DEMO.solicitudItems.push({solicitud_id:solicitudId, item_id:it.item_id, cantidad:it.cantidad}));
      return {error:null};
    }
    const {error} = await sb.rpc("crear_solicitud", {
      p_profesor_id:profesor_id, p_clase_id:clase_id, p_salon:salon,
      p_hora:hora, p_jornada:jornada, p_dia:dia, items_json:items,
    });
    return {error};
  },

  async getSolicitudes(profesorId){
    if(DEMO_MODE){
      let lista = DEMO.solicitudes.slice().sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
      if(profesorId) lista = lista.filter(s=>s.profesor_id===profesorId);
      return lista.map(s=>({
        ...s,
        clases:{nombre: DEMO.clases.find(c=>c.id===s.clase_id)?.nombre},
        perfiles:{nombre: DEMO.perfiles.find(p=>p.id===s.profesor_id)?.nombre},
        solicitud_items: DEMO.solicitudItems.filter(si=>si.solicitud_id===s.id).map(si=>({
          cantidad: si.cantidad,
          items_catalogo:{nombre: DEMO.itemsCatalogo.find(i=>i.id===si.item_id)?.nombre},
        })),
      }));
    }
    let query = sb.from("solicitudes")
      .select("*, clases(nombre), perfiles:profesor_id(nombre), solicitud_items(cantidad, items_catalogo(nombre))")
      .order("created_at", {ascending:false});
    if(profesorId) query = query.eq("profesor_id", profesorId);
    const {data} = await query;
    return data || [];
  },

  async crearReporte(payload){
    if(DEMO_MODE){ DEMO.reportes.push(payload); return {error:null}; }
    const {error} = await sb.from("reportes").insert(payload);
    return {error};
  },

  async subirFoto(file){
    if(DEMO_MODE) return URL.createObjectURL(file); // solo vista previa local, no se guarda de verdad
    const path = `reportes/${Date.now()}_${file.name}`;
    const {error} = await sb.storage.from("fotos").upload(path, file);
    if(error) return null;
    return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
  },

  async getRevisionesPrevia(claseId, tipo){
    if(DEMO_MODE){
      const map = {};
      DEMO.revisiones.filter(r=>r.clase_id===claseId && r.tipo===tipo).forEach(r=> map[r.estudiante_id]=r);
      return map;
    }
    const {data} = await sb.from("revisiones_proceso").select("*").eq("clase_id", claseId).eq("tipo", tipo);
    const map = {};
    (data||[]).forEach(p=> map[p.estudiante_id]=p);
    return map;
  },

  async guardarRevision(rows){
    if(DEMO_MODE){
      rows.forEach(r=>{
        const idx = DEMO.revisiones.findIndex(x=>x.estudiante_id===r.estudiante_id && x.clase_id===r.clase_id && x.tipo===r.tipo);
        if(idx>=0) DEMO.revisiones[idx]=r; else DEMO.revisiones.push(r);
      });
      return {error:null};
    }
    const {error} = await sb.from("revisiones_proceso").upsert(rows, {onConflict:"estudiante_id,clase_id,tipo"});
    return {error};
  },
};

function renderCalendarioHTML(){
  const DOWS = ["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];
  let html = `<h2 class="section-title">Calendario administrativo — Cursos de Música UIS 2026-2</h2>`;
  CALENDAR_MONTHS.forEach(({y,m,nombre})=>{
    const first = new Date(y, m-1, 1);
    const startDow = (first.getDay()+6)%7;
    const daysInMonth = new Date(y, m, 0).getDate();
    let cells = "";
    for(let i=0;i<startDow;i++) cells += `<div class="day empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const ev = CALENDAR_EVENTS[iso];
      let cls = "day";
      let inner = `<div class="num">${d}</div>`;
      if(ev){
        if(ev.tag === "FESTIVO"){ cls += " festivo"; inner += `<div class="ev"><span class="badge festivo">FESTIVO</span></div>`; }
        else {
          if(ev.tag){ cls += " clase"; inner += `<div class="ev"><span class="badge">${ev.tag}</span></div>`; }
          if(ev.text){ inner += `<div class="ev">${ev.text}</div>`; }
        }
      }
      cells += `<div class="${cls}">${inner}</div>`;
    }
    html += `<div class="calendar-month"><h3 class="section-title">${nombre} ${y}</h3>
      <div class="calendar-grid">
        ${DOWS.map(d=>`<div class="dow">${d}</div>`).join("")}
        ${cells}
      </div></div>`;
  });
  return html;
}

let pinBuffer = "";
let pinTarget = null; // el perfil que se está intentando verificar

function initialesDe(nombre){
  return (nombre||"").split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();

async function renderLogin(){
  const perfiles = await DB.getAllPerfiles();
  document.getElementById("root").innerHTML = `
    <div class="login-wrap">
      ${DEMO_MODE ? `<div class="demo-banner" style="width:100%;">🧪 MODO DEMOSTRACIÓN — datos de ejemplo, no conectado a Supabase todavía.</div>` : ""}
      <div class="splash-logo">

      </div>
      <p class="splash-note">Selecciona tu usuario para ingresar</p>
      <div class="user-grid">
        ${perfiles.map(p=>`
          <div class="uc" onclick='abrirPinPad(${JSON.stringify(p)})'>
            <div class="av">${initialesDe(p.nombre)}</div>
            <div class="un">${p.nombre}</div>
            <div class="ur">${p.rol}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div id="pinModalWrap"></div>
  `;
}

function abrirPinPad(perfil){
  pinTarget = perfil;
  pinBuffer = "";
  const wrap = document.getElementById("pinModalWrap");
  const largo = Math.max(3, (perfil.pin||"").length);
  wrap.innerHTML = `
    <div class="pin-modal-overlay">
      <div class="pin-box">
        <div class="av-big">${initialesDe(perfil.nombre)}</div>
        <h3>${perfil.nombre}</h3>
        <p>Ingresa tu PIN</p>
        <div class="pin-dots" id="pinDots">
          ${Array.from({length:largo}).map((_,i)=>`<div class="pin-dot" id="pd${i}"></div>`).join("")}
        </div>
        <div class="pin-pad">
          <button class="pb" onclick="pk('1')">1</button><button class="pb" onclick="pk('2')">2</button><button class="pb" onclick="pk('3')">3</button>
          <button class="pb" onclick="pk('4')">4</button><button class="pb" onclick="pk('5')">5</button><button class="pb" onclick="pk('6')">6</button>
          <button class="pb" onclick="pk('7')">7</button><button class="pb" onclick="pk('8')">8</button><button class="pb" onclick="pk('9')">9</button>
          <button class="pb" onclick="cerrarPinPad()">✕</button><button class="pb" onclick="pk('0')">0</button><button class="pb" onclick="pborrar()">⌫</button>
        </div>
        <div class="pin-err" id="pinErr"></div>
      </div>
    </div>
  `;
}

function cerrarPinPad(){
  pinTarget = null; pinBuffer = "";
  document.getElementById("pinModalWrap").innerHTML = "";
}

function actualizarDots(){
  const dots = document.querySelectorAll("#pinDots .pin-dot");
  dots.forEach((d,i)=> d.classList.toggle("filled", i < pinBuffer.length));
}

async function pk(digito){
  if(!pinTarget) return;
  const largo = Math.max(3, (pinTarget.pin||"").length);
  if(pinBuffer.length >= largo) return;
  pinBuffer += digito;
  actualizarDots();
  if(pinBuffer.length === largo) await verificarPin();
}

function pborrar(){
  pinBuffer = pinBuffer.slice(0, -1);
  actualizarDots();
  const err = document.getElementById("pinErr");
  if(err) err.textContent = "";
}

async function verificarPin(){
  const perfil = await DB.loginByPin(pinBuffer);
  if(perfil && perfil.id === pinTarget.id){
    session = perfil;
    cerrarPinPad();
    currentTab = tabsForRole(session.rol)[0].id;
    renderApp();
  } else {
    const err = document.getElementById("pinErr");
    if(err) err.textContent = "PIN incorrecto. Intenta de nuevo.";
    pinBuffer = "";
    actualizarDots();
  }
}

function logout(){ detenerSuscripcionSolicitudes(); session = null; renderLogin(); }

/* =========================================================
   NAVEGACIÓN POR ROL
   ========================================================= */
function tabsForRole(rol){
  const ALL = [
    {id:"asistencia", label:"Asistencia"},
    {id:"estudiantes", label:"Estudiantes"},
    {id:"reportes", label:"Reportes"},
    {id:"solicitudes", label:"Solicitudes"},
    {id:"revision", label:"Revisión del Proceso"},
    {id:"calendario", label:"Calendario"},
    {id:"musicpass", label:"Music Pass"},
  ];
  if(rol === "logistica") return ALL.filter(t => ["solicitudes","calendario","musicpass"].includes(t.id));
  return ALL;
}

function renderApp(){
  const tabs = tabsForRole(session.rol);
  const rolLabel = session.rol === "coordinadora" ? "Coordinadora" : session.rol === "logistica" ? "Logística" : "Profesor(a)";
  document.getElementById("root").innerHTML = `
    ${DEMO_MODE ? `<div class="demo-banner">🧪 MODO DEMOSTRACIÓN — datos de ejemplo, no conectado a Supabase todavía.</div>` : ""}
    <header class="app-header">
      <h1>🎵 Cursos de Música UIS 2026-2</h1>
      <div class="user-box">
        ${session.nombre} · ${rolLabel}
        <button class="salir" style="border-color:var(--verde-claro); margin-right:6px;" onclick="abrirCambiarPin()">Cambiar PIN</button>
        <button class="salir" onclick="logout()">Salir</button>
      </div>
    </header>
    <nav class="tabs">
      ${tabs.map(t=>`<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join("")}
    </nav>
    <main id="mainContent"><div class="empty-state">Cargando...</div></main>
    <footer class="app-footer">Cursos de Música UIS · Universidad Industrial de Santander · 2026-2</footer>
  `;
  loadTab(currentTab);
}

function switchTab(id){
  currentTab = id;
  if(id !== "solicitudes") detenerSuscripcionSolicitudes();
  document.querySelectorAll("nav.tabs button").forEach(b=> b.classList.toggle("active", b.dataset.tab===id));
  loadTab(id);
}

async function loadTab(id){
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="empty-state">Cargando...</div>`;
  try{
    if(id==="asistencia") await viewAsistencia(main);
    else if(id==="estudiantes") await viewEstudiantes(main);
    else if(id==="reportes") await viewReportes(main);
    else if(id==="solicitudes") await viewSolicitudes(main);
    else if(id==="revision") await viewRevision(main);
    else if(id==="calendario") main.innerHTML = renderCalendarioHTML();
    else if(id==="musicpass") await viewMusicPass(main);
  }catch(err){
    console.error(err);
    main.innerHTML = `<div class="empty-state">Ocurrió un error cargando esta sección. Revisa la consola (F12).</div>`;
  }
}

const AS = { profesorId:null, fecha:null, claseId:null, clases:[] };

async function viewAsistencia(main){
  if(!AS.profesorId) AS.profesorId = (session.rol==="profesor") ? session.id : null;
  let profesores = [];
  if(session.rol==="coordinadora"){
    profesores = await DB.getProfesores();
    if(!AS.profesorId && profesores.length) AS.profesorId = profesores[0].id;
  }
  if(!AS.fecha) AS.fecha = new Date().toISOString().slice(0,10);

  AS.clases = await DB.getClasesByProfesor(AS.profesorId);

        <select onchange="AS.profesorId=this.value; AS.claseId=null; loadTab('asistencia')">

        </div>
        <div>

  }, 15000);
  await renderAsistenciaLista();
}

async function renderAsistenciaLista(){
  const wrap = document.getElementById("asListaWrap");
  if(!wrap) return;
  if(!AS.claseId){ wrap.innerHTML = `<div class="empty-state">Este profesor no tiene clases registradas.</div>`; return; }

  const estudiantes = await DB.getEstudiantesByClase(AS.claseId);
  const previaMap = await DB.getAsistenciaPrevia(AS.claseId, AS.fecha);

  if(!estudiantes.length){ wrap.innerHTML = `<div class="empty-state">No hay estudiantes matriculados en esta clase.</div>`; return; }

  wrap.innerHTML = `
    <div class="card">
      ${estudiantes.map(e=>`
        <div class="estudiante-row">
          <input type="checkbox" id="chk_${e.id}" ${previaMap[e.id] !== false ? "checked" : ""}>
          <label for="chk_${e.id}" style="margin:0; text-transform:none; color:var(--gris-texto); font-weight:500; cursor:pointer;">${e.nombre}</label>
        </div>
      `).join("")}
      <button class="btn-primary" style="margin-top:14px" onclick='guardarAsistencia(${JSON.stringify(estudiantes.map(e=>e.id))})'>Guardar</button>
    </div>`;
}

async function guardarAsistencia(estudianteIds){
  const horaRegistro = new Date().toTimeString().slice(0,5);
  const rows = estudianteIds.map(id => ({
    estudiante_id: id, clase_id: AS.claseId, profesor_id: AS.profesorId, fecha: AS.fecha,
    hora: horaRegistro,
    presente: document.getElementById("chk_"+id).checked,
  }));
  const {error} = await DB.guardarAsistencia(rows);
  if(error){ toast("Error al guardar: "+error.message); return; }
  toast("Asistencia guardada a las "+horaRegistro+". Se marcó falta a los no seleccionados.");
}

function renderReportesForm(){

async function enviarReporte(){
  const claseSel = document.getElementById("repClase");
  const claseId = claseSel.value;
  const claseNombre = claseSel.selectedOptions[0]?.dataset.nombre || "";
  const salon = document.getElementById("repSalon").value.trim();
  const hora = new Date().toTimeString().slice(0,5);
  const novedad = document.getElementById("repNovedad").value.trim();

  if(!claseId || !salon || !novedad){ toast("Completa clase, salón y novedad."); return; }

  const {error} = await DB.crearReporte({
    profesor_id: session.id, clase_id: claseId, tipo: REP.tipo,
    salon, hora, novedad, foto_url: null, fecha: new Date().toISOString(),
  });
  if(error){ toast("Error al guardar: "+error.message); return; }

  const resumen = `*Reporte (${REP.tipo==="como_lo_encontre"?"Cómo lo encontré":"Cómo lo dejé"})*\nProfesor: ${session.nombre}\nClase: ${claseNombre}\nSalón: ${salon}\nHora: ${hora}\nNovedad: ${novedad}`;
  copiarAlPortapapeles(resumen);
  mostrarResumenReporte(resumen);
  document.getElementById("repNovedad").value = "";
}

function copiarAlPortapapeles(texto){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texto).catch(()=>copiarConTextarea(texto));
  } else {
    copiarConTextarea(texto);
  }
}

function copiarConTextarea(texto){
  const ta = document.createElement("textarea");
  ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); }catch(e){ /* si falla, el texto sigue visible en el modal para copiarlo a mano */ }
  document.body.removeChild(ta);
}

function mostrarResumenReporte(resumen){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-qr" style="max-width:400px; width:92vw; text-align:left;">
      <h3 style="margin-top:0;">✅ Reporte guardado</h3>
      <p style="font-size:.85rem; opacity:.9;">El resumen ya se copió a tu portapapeles. Abre WhatsApp, pégalo (mantén presionado → Pegar) y adjunta la foto manualmente.</p>
      <div style="background:#fff; color:#222; border-radius:8px; padding:12px; font-size:.82rem; white-space:pre-wrap; margin:10px 0;">${resumen.replace(/</g,"&lt;")}</div>
      <a href="https://wa.me/${WHATSAPP_NUMERO}" target="_blank" class="btn-secondary" style="display:inline-block; text-decoration:none; text-align:center; width:100%;">Abrir WhatsApp</a>
      <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.modal-overlay').remove()">Cerrar</button>
    </div>`;
  document.body.appendChild(overlay);
}

const SOL = { profesorId:null, claseId:null, salon:"", hora:"", jornada:"AM", dia:null, carrito:[], itemsCatalogo:[] };
let solicitudesChannel = null;

function suscribirSolicitudesEnVivo(){
  if(DEMO_MODE || !sb) return; // el modo demostración no tiene backend real que escuchar
  detenerSuscripcionSolicitudes();
  solicitudesChannel = sb.channel("solicitudes-en-vivo")
    .on("postgres_changes", {event:"*", schema:"public", table:"solicitudes"}, () => {
      if(currentTab === "solicitudes"){ refreshCatalogo(); renderListaSolicitudes(); }
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"solicitud_items"}, () => {
      if(currentTab === "solicitudes"){ refreshCatalogo(); renderListaSolicitudes(); }
    })
    .subscribe();
}

function detenerSuscripcionSolicitudes(){
  if(solicitudesChannel){ sb.removeChannel(solicitudesChannel); solicitudesChannel = null; }
}

async function viewSolicitudes(main){
  const puedeCrear = session.rol === "profesor" || session.rol === "coordinadora";
  if(!SOL.profesorId) SOL.profesorId = (session.rol === "profesor") ? session.id : null;

  let profesores = [];
  if(session.rol === "coordinadora"){
    profesores = await DB.getProfesores();
    if(!SOL.profesorId && profesores.length) SOL.profesorId = profesores[0].id;
  }

  const clases = puedeCrear ? await DB.getClasesByProfesor(SOL.profesorId) : [];
  SOL.clasesDisponibles = clases;
  SOL.itemsCatalogo = await DB.getCatalogoItems();
  if(!SOL.dia) SOL.dia = new Date().toISOString().slice(0,10);
  if(!SOL.claseId || !clases.find(c=>c.id===SOL.claseId)) SOL.claseId = clases[0]?.id || null;
  if(!SOL.salon) SOL.salon = clases.find(c=>c.id===SOL.claseId)?.salon_defecto || "";
  if(!SOL.hora) SOL.hora = clases.find(c=>c.id===SOL.claseId)?.hora_defecto || "";
  suscribirSolicitudesEnVivo();

  main.innerHTML = `
    <h2 class="section-title">Solicitudes</h2>
    ${puedeCrear ? `
    <div class="card">
      ${session.rol==="coordinadora" ? `
        <label>Profesor</label>
        <select onchange="SOL.profesorId=this.value; SOL.claseId=null; SOL.salon=''; SOL.hora=''; loadTab('solicitudes')">
          ${profesores.map(p=>`<option value="${p.id}" ${p.id===SOL.profesorId?"selected":""}>${p.nombre}</option>`).join("")}
        </select>` : ""}
      <div class="grid-2">
        <div>
          <label>Clase</label>
          <select onchange="onClaseSolicitudChange(this.value)">
            ${clases.map(c=>`<option value="${c.id}" ${c.id===SOL.claseId?"selected":""}>${c.nombre}</option>`).join("") || `<option value="">Sin clases</option>`}
          </select>
          <label>Salón</label>
          <input id="solSalonInput" type="text" placeholder="Ej: Salón 204" value="${SOL.salon || clases.find(c=>c.id===SOL.claseId)?.salon_defecto || ""}" oninput="SOL.salon=this.value">
          <label>Hora de la clase</label>
          <input id="solHoraInput" type="time" value="${SOL.hora || clases.find(c=>c.id===SOL.claseId)?.hora_defecto || ""}" oninput="SOL.hora=this.value; refreshCatalogo()">
        </div>
        <div>
          <label>Jornada</label>
          <select onchange="SOL.jornada=this.value">
            <option value="AM" ${SOL.jornada==="AM"?"selected":""}>AM</option>
            <option value="PM" ${SOL.jornada==="PM"?"selected":""}>PM</option>
          </select>
          <label>Día para el que se solicita</label>
          <input type="date" value="${SOL.dia}" onchange="SOL.dia=this.value; refreshCatalogo()">
        </div>
      </div>
      <label>Hora de la solicitud (registrada automáticamente)</label>
      <input id="solHoraRegistro" type="text" value="${new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}" disabled style="background:#f4f8ec; color:var(--verde-oscuro); font-weight:600; max-width:160px;">
      <h3 class="section-title">🛒 Elementos disponibles</h3>
      <div id="catalogoWrap"></div>
      <h3 class="section-title">Resumen de la solicitud</h3>
      <div id="carritoWrap"></div>
      <button class="btn-primary" style="margin-top:10px" onclick="enviarSolicitud()">ENVIAR</button>
    </div>` : ""}
    <h3 class="section-title">${session.rol==="profesor" ? "Mis solicitudes" : "Todas las solicitudes"}</h3>
    <div id="listaSolicitudesWrap"></div>
  `;
  if(window.__solHoraTimer) clearInterval(window.__solHoraTimer);
  window.__solHoraTimer = setInterval(()=>{
    const el = document.getElementById("solHoraRegistro");
    if(el) el.value = new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  }, 15000);
  if(puedeCrear) await refreshCatalogo();
  await renderListaSolicitudes();
}

function onClaseSolicitudChange(claseId){
  SOL.claseId = claseId;
  const clase = (SOL.clasesDisponibles || []).find(c => c.id === claseId);
  const salonInput = document.getElementById("solSalonInput");
  const horaInput = document.getElementById("solHoraInput");
  if(salonInput){ salonInput.value = clase?.salon_defecto || ""; SOL.salon = salonInput.value; }
  if(horaInput){ horaInput.value = clase?.hora_defecto || ""; SOL.hora = horaInput.value; }
  refreshCatalogo();
}

async function refreshCatalogo(){
  const wrap = document.getElementById("catalogoWrap");
  if(!wrap) return;
  const usados = await DB.getUsosItems(SOL.dia, SOL.hora);
  wrap.innerHTML = SOL.itemsCatalogo.map(it=>{
    const disponible = it.cantidad_disponible_por_hora - (usados[it.id]||0);
    return `<div class="carrito-item">
      <span>${it.nombre} <span class="disponible-tag">(${Math.max(disponible,0)} disponibles a esa hora)</span></span>
      <span>
        <input type="number" min="0" max="${Math.max(disponible,0)}" value="0" style="width:60px; display:inline-block;" id="cant_${it.id}">
        <button class="btn-secondary" onclick="agregarAlCarrito('${it.id}', ${disponible})">Agregar</button>
      </span>
    </div>`;
  }).join("") || `<div class="empty-state">No hay elementos en el catálogo.</div>`;
  renderCarrito();
}

function agregarAlCarrito(itemId, disponible){
  const cant = parseInt(document.getElementById("cant_"+itemId).value || "0", 10);
  if(cant <= 0){ toast("Indica una cantidad mayor a 0."); return; }
  if(cant > disponible){ toast("No hay suficiente disponibilidad."); return; }
  const item = SOL.itemsCatalogo.find(i=>i.id===itemId);
  const existente = SOL.carrito.find(c=>c.itemId===itemId);
  if(existente) existente.cantidad = cant; else SOL.carrito.push({itemId, nombre:item.nombre, cantidad:cant});
  renderCarrito();
}

function quitarDelCarrito(itemId){
  SOL.carrito = SOL.carrito.filter(c=>c.itemId!==itemId);
  renderCarrito();
}

function renderCarrito(){
  const wrap = document.getElementById("carritoWrap");
  if(!wrap) return;
  wrap.innerHTML = SOL.carrito.length ? SOL.carrito.map(c=>`
    <div class="carrito-item">
      <span>${c.nombre} × ${c.cantidad}</span>
      <button class="btn-secondary" onclick="quitarDelCarrito('${c.itemId}')">Quitar</button>
    </div>`).join("") : `<div class="empty-state">Aún no has agregado elementos.</div>`;
}

async function enviarSolicitud(){
  if(!SOL.claseId || !SOL.salon || !SOL.hora || !SOL.dia){ toast("Completa clase, salón, hora y día."); return; }
  if(!SOL.carrito.length){ toast("Agrega al menos un elemento."); return; }
  const items = SOL.carrito.map(c=>({item_id:c.itemId, cantidad:c.cantidad}));
  const {error} = await DB.crearSolicitud({
    profesor_id: SOL.profesorId, clase_id: SOL.claseId, salon: SOL.salon,
    hora: SOL.hora, jornada: SOL.jornada, dia: SOL.dia, items,
  });
  if(error){ toast("No se pudo enviar: "+error.message); return; }
  toast("Solicitud enviada.");
  SOL.carrito = [];
  await refreshCatalogo();
  await renderListaSolicitudes();
}

async function renderListaSolicitudes(){
  const wrap = document.getElementById("listaSolicitudesWrap");
  if(!wrap) return;
  const data = await DB.getSolicitudes(session.rol==="profesor" ? session.id : null);
  wrap.innerHTML = `<table>
    <tr><th>Fecha solicitud</th><th>Profesor</th><th>Clase</th><th>Salón</th><th>Día/Hora</th><th>Jornada</th><th>Elementos</th></tr>
    ${data.map(s=>`<tr>
      <td>${fmtFecha(s.created_at)}</td>
      <td>${s.perfiles?.nombre||"-"}</td>
      <td>${s.clases?.nombre||"-"}</td>
      <td>${s.salon}</td>
      <td>${s.dia} · ${s.hora}</td>
      <td>${s.jornada}</td>
      <td>${(s.solicitud_items||[]).map(i=>`${i.items_catalogo?.nombre} ×${i.cantidad}`).join(", ")}</td>
    </tr>`).join("") || `<tr><td colspan="7" style="color:#999;font-style:italic">Sin solicitudes registradas</td></tr>`}
  </table>`;
}

  if(!wrap) return;
  if(!REV.claseId){ wrap.innerHTML = `<div class="empty-state">Este profesor no tiene clases registradas.</div>`; return; }

  const estudiantes = await DB.getEstudiantesByClase(REV.claseId);
  const previaMap = await DB.getRevisionesPrevia(REV.claseId, REV.tipo);

  if(!estudiantes.length){ wrap.innerHTML = `<div class="empty-state">No hay estudiantes matriculados en esta clase.</div>`; return; }

  wrap.innerHTML = `<div class="card">
    ${estudiantes.map(e=>{
      const prev = previaMap[e.id] || {};
      return `<div style="border-bottom:1px solid var(--gris-borde); padding:10px 0;">
        <strong>${e.nombre}</strong>
        <label>Observaciones</label>
        <textarea id="obs_${e.id}" rows="2">${prev.observaciones||""}</textarea>
        <label>Porcentaje de avance (0-100%)</label>
        <input id="pct_${e.id}" type="number" min="0" max="100" value="${prev.porcentaje ?? 0}">
      </div>`;
    }).join("")}
    <button class="btn-primary" style="margin-top:14px" onclick='guardarRevision(${JSON.stringify(estudiantes.map(e=>e.id))})'>Guardar</button>
  </div>`;
}

async function guardarRevision(estudianteIds){
  const rows = estudianteIds.map(id => ({
    estudiante_id: id, clase_id: REV.claseId, profesor_id: REV.profesorId, tipo: REV.tipo,
    fecha: new Date().toISOString().slice(0,10),
    observaciones: document.getElementById("obs_"+id).value,
    porcentaje: parseInt(document.getElementById("pct_"+id).value || "0", 10),
  }));
  const {error} = await DB.guardarRevision(rows);
  if(error){ toast("Error al guardar: "+error.message); return; }
  toast("Revisión del proceso guardada.");
}

async function verFaltasEstudiante(estudianteId, nombreEstudiante, profesorIdRestriccion){
  const historial = await DB.getHistorialAsistencia(estudianteId, profesorIdRestriccion === "null" ? null : profesorIdRestriccion);
  const faltas = historial.filter(h=>h.presente===false).length;
  const asistidas = historial.filter(h=>h.presente===true).length;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-qr" style="max-width:420px; width:92vw; text-align:left; max-height:80vh; overflow-y:auto;">
      <h3 style="margin-top:0;">Historial de ${nombreEstudiante}</h3>
      <p style="font-size:.85rem; opacity:.9;">✅ ${asistidas} asistencias &nbsp;·&nbsp; ❌ ${faltas} faltas</p>
      <table style="background:#fff; border-radius:8px; overflow:hidden;">
        <tr><th>Fecha</th><th>Clase</th><th>Estado</th></tr>
        ${historial.length ? historial.map(h=>`
          <tr>
            <td style="color:#222;">${h.fecha}${h.hora ? " · "+h.hora : ""}</td>
            <td style="color:#222;">${h.clase||"-"}</td>
            <td>${h.presente ? `<span class="badge">Asistió</span>` : `<span class="badge festivo">Falta</span>`}</td>
          </tr>`).join("") : `<tr><td colspan="3" style="color:#999; font-style:italic;">Sin registros de asistencia todavía</td></tr>`}
      </table>
      <button class="btn-secondary" style="margin-top:14px" onclick="this.closest('.modal-overlay').remove()">Cerrar</button>
    </div>`;
  document.body.appendChild(overlay);
}

function abrirCambiarPin(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="pin-box">
      <div class="av-big">${initialesDe(session.nombre)}</div>
      <h3>Cambiar tu PIN</h3>
      <p>Elige un PIN nuevo de 3 a 6 números</p>
      <input id="nuevoPin1" type="password" inputmode="numeric" maxlength="6" placeholder="Nuevo PIN" style="text-align:center; letter-spacing:6px; font-size:1.2rem; margin-bottom:10px;">
      <input id="nuevoPin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirma el PIN" style="text-align:center; letter-spacing:6px; font-size:1.2rem;">
      <div class="pin-err" id="cambiarPinErr"></div>
      <button class="btn-primary" style="width:100%; margin-top:14px;" onclick="guardarNuevoPin()">Guardar</button>
      <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
    </div>`;
  document.body.appendChild(overlay);
}

async function guardarNuevoPin(){
  const p1 = document.getElementById("nuevoPin1").value.trim();
  const p2 = document.getElementById("nuevoPin2").value.trim();
  const err = document.getElementById("cambiarPinErr");
  if(p1.length<3 || p1.length>6 || !/^\d+$/.test(p1)){ err.textContent = "El PIN debe tener entre 3 y 6 números."; return; }
  if(p1 !== p2){ err.textContent = "Los dos PIN no coinciden."; return; }
  const {error} = await DB.updatePin(session.id, p1);
  if(error){ err.textContent = error.message; return; }
  session.pin = p1;
  document.querySelector(".modal-overlay").remove();
  toast("Tu PIN se actualizó correctamente. Úsalo la próxima vez que entres.");
}

function abrirModalQR(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

    </div>`;
  document.body.appendChild(overlay);
  new QRCode(document.getElementById("qrBig"), {
    text: `UIS-MUSICA-2026-2:${session.id}`, width:220, height:220,
    colorDark:"#31511E", colorLight:"#ffffff",
  });
}
